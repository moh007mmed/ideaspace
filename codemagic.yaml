workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m1
    environment:
      android_signing:
      groups:
        - google_play
    scripts:
      - name: Download Gradle, Generate Keystore and Build APK
        script: |
          # 1. تحميل وتثبيت الإصدار المطلوب من Gradle
          curl -L -o gradle-9.3.1-bin.zip https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle-9.3.1-bin.zip
          export PATH=$PWD/gradle-9.3.1/bin:$PATH
          
          # 2. توليد ملف التوقيع المفقود تلقائياً
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          
          # 3. بناء التطبيق واستخراج الـ APK
          gradle assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
