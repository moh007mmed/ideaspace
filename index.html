<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111827"><meta name="description" content="IdeaSpace — مساحة أفكار خاصة ومحلية">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="stylesheet" href="styles.css">
<title>IdeaSpace</title>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">✳</span><div><b>IdeaSpace</b><small>مساحة أفكارك الخاصة</small></div></div>
  <div class="top-actions"><span id="saveStatus" class="saved">● محفوظ محلياً</span><button id="menuBtn" class="iconbtn" title="القائمة">⋯</button></div>
</header>
<div id="menu" class="menu hidden">
  <button data-cmd="new">مشروع جديد</button><button data-cmd="backup">نسخة احتياطية JSON</button><button data-cmd="restore">استيراد مشروع JSON</button><button data-cmd="exportPng">تصدير صورة PNG</button><button data-cmd="exportSvg">تصدير SVG</button><button data-cmd="help">المساعدة</button>
</div>
<main id="viewport">
  <div id="world">
    <svg id="links"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#a99cff"/></marker></defs><g id="lg"></g></svg>
    <div id="items"></div>
  </div>
  <canvas id="ink"></canvas>
  <section id="welcome" class="welcome">
    <div class="welcome-logo">✳</div><h1>أفكارك تبدأ هنا</h1>
    <p>أضف ملاحظات وصوراً وارسم واربط أفكارك. اسحب مساحة فارغة لتحريك اللوحة.</p>
    <button class="primary" data-cmd="note">إنشاء أول ملاحظة</button>
  </section>
</main>
<div class="zoombar"><button data-cmd="zoomIn" aria-label="تكبير">＋</button><button data-cmd="zoomOut" aria-label="تصغير">−</button><button data-cmd="fit" aria-label="إعادة العرض">⌂</button><span id="zoomLabel" data-cmd="reset" title="إعادة 100%">100%</span></div>
<div id="props" class="props hidden"></div>
<nav class="toolbar">
  <button data-cmd="note"><span>▤</span><small>ملاحظة</small></button>
  <button data-cmd="text"><span>T</span><small>نص</small></button>
  <button data-cmd="shape"><span>◇</span><small>شكل</small></button>
  <button data-cmd="mind"><span>◉</span><small>فكرة</small></button>
  <button data-cmd="draw"><span>✎</span><small>رسم</small></button>
  <button data-cmd="connect"><span>↗</span><small>ربط</small></button>
  <button data-cmd="image"><span>▧</span><small>صورة</small></button>
  <button data-cmd="file"><span>＋</span><small>ملف نصي</small></button>
  <button data-cmd="undo"><span>↶</span><small>تراجع</small></button>
  <button data-cmd="redo"><span>↷</span><small>إعادة</small></button>
</nav>
<input id="imageInput" type="file" accept="image/*" hidden>
<input id="textInput" type="file" accept=".txt,.md,.csv,text/plain,text/markdown,text/csv" hidden>
<input id="projectInput" type="file" accept=".json,application/json" hidden>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body></html>
